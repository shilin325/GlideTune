<!doctype html>
<html><body><pre id="o">…</pre>
<script type="module">
const out = document.getElementById('o')
const log = (s) => { out.textContent += s + '\n'; console.log(s) }
const MIN_BPM=70, MAX_BPM=180
function normalizeBpm(raw){let bpm=raw;while(bpm<MIN_BPM)bpm*=2;while(bpm>MAX_BPM)bpm/=2;return Math.round(Math.min(MAX_BPM,Math.max(MIN_BPM,bpm)))}
function collectPeaks(data, sampleRate){
  const peaks=[]; const samplesPerWindow=Math.max(1,Math.floor(sampleRate*0.25))
  let i=0
  while(i+samplesPerWindow<data.length){
    let max=0,maxIndex=i
    for(let j=0;j<samplesPerWindow;j++){const v=Math.abs(data[i+j]); if(v>max){max=v;maxIndex=i+j}}
    if(max>0.01) peaks.push(maxIndex)
    i+=samplesPerWindow
  }
  return peaks
}
function tempoFromPeaks(peaks, sampleRate){
  if(peaks.length<4) return null
  const counts=new Map()
  const maxInterval=Math.floor((60/MIN_BPM)*sampleRate)
  const minInterval=Math.floor((60/MAX_BPM)*sampleRate)
  for(let i=0;i<peaks.length;i++){
    for(let j=i+1;j<peaks.length&&j<i+12;j++){
      const interval=peaks[j]-peaks[i]
      if(interval<minInterval||interval>maxInterval) continue
      const bpm=Math.round((60*sampleRate)/interval)
      if(bpm<MIN_BPM||bpm>MAX_BPM) continue
      counts.set(bpm,(counts.get(bpm)||0)+1)
      counts.set(bpm-1,(counts.get(bpm-1)||0)+0.5)
      counts.set(bpm+1,(counts.get(bpm+1)||0)+0.5)
    }
  }
  let bestBpm=0,bestScore=0
  for(const [bpm,score] of counts){ if(bpm<MIN_BPM||bpm>MAX_BPM)continue; if(score>bestScore){bestScore=score;bestBpm=bpm} }
  return bestBpm||null
}
async function detect(url){
  const t0=performance.now()
  const res=await fetch(url)
  const ab=await res.arrayBuffer()
  const ac=new AudioContext()
  const buffer=await ac.decodeAudioData(ab.slice(0))
  const sampleRate=buffer.sampleRate
  const offset=Math.min(8,Math.max(0,buffer.duration*0.15))
  const duration=Math.min(32,Math.max(10,buffer.duration-offset))
  const length=Math.max(1,Math.floor(duration*sampleRate))
  const offline=new OfflineAudioContext(1,length,sampleRate)
  const source=offline.createBufferSource()
  source.buffer=buffer
  const filter=offline.createBiquadFilter()
  filter.type='lowpass'; filter.frequency.value=150; filter.Q.value=1
  source.connect(filter); filter.connect(offline.destination)
  source.start(0,offset,duration)
  const rendered=await offline.startRendering()
  const data=rendered.getChannelData(0)
  const peaks=collectPeaks(data,sampleRate)
  const tempo=tempoFromPeaks(peaks,sampleRate)
  await ac.close()
  const bpm=tempo==null?null:normalizeBpm(tempo)
  log(`${url.split('/').pop()}: bpm=${bpm} peaks=${peaks.length} ${(performance.now()-t0).toFixed(0)}ms dur=${buffer.duration.toFixed(1)}s`)
}
