<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#292524"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="ring" x1="18" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f5f4"/>
      <stop offset="1" stop-color="#d6d3d1"/>
    </linearGradient>
    <linearGradient id="accent" x1="38" y1="16" x2="52" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)"/>

  <!-- Soft inner sheen -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" stroke="url(#ring)" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Vinyl disc -->
  <circle cx="30" cy="33" r="16.5" fill="url(#ring)" fill-opacity="0.96"/>
  <circle cx="30" cy="33" r="16.5" stroke="#a8a29e" stroke-opacity="0.35" stroke-width="0.75"/>
  <circle cx="30" cy="33" r="11.5" fill="none" stroke="#a8a29e" stroke-opacity="0.28" stroke-width="0.7"/>
  <circle cx="30" cy="33" r="7.2" fill="none" stroke="#a8a29e" stroke-opacity="0.22" stroke-width="0.7"/>
  <circle cx="30" cy="33" r="2.6" fill="#1c1917"/>

  <!-- Glide arc / motion cue -->
  <path
    d="M42.5 20.5c5.2 2.8 8.4 8.4 8.4 14.5 0 3.2-.8 6.2-2.3 8.8"
    stroke="url(#accent)"
    stroke-width="2.4"
    stroke-linecap="round"
    filter="url(#soft)"
  />
  <circle cx="48.6" cy="43.8" r="1.7" fill="#fb7185"/>
</svg>
